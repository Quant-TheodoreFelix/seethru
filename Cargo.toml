[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
seethru-core = { path = "crates/seethru-core" }
seethru-analyzer = { path = "crates/seethru-analyzer" }
seethru-guard = { path = "crates/seethru-guard" }
seethru-probe = { path = "crates/seethru-probe" }
seethru-fix = { path = "crates/seethru-fix" }
seethru-report = { path = "crates/seethru-report" }
seethru-mcp = { path = "crates/seethru-mcp" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
base64 = "=0.23.1"
lexopt = "=0.3.2"
sha2 = "=0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true
strip = true
